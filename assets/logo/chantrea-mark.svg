<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" role="img" aria-label="Chantrea Systems">
  <!-- Chantrea logo 3d: the terminal window, dark version. The penguin looks at the crescent; the crescent is cut with a mask so it stays transparent. -->
  <defs>
    <mask id="crescent">
      <circle cx="156" cy="70" r="30" fill="#fff"/>
      <circle cx="170" cy="60" r="26" fill="#000"/>
    </mask>
  </defs>
  <rect x="4" y="4" width="212" height="162" rx="14" fill="none" stroke="#9fe0a8" stroke-width="5"/>
  <circle cx="24" cy="22" r="5" fill="#9fe0a8"/><circle cx="40" cy="22" r="5" fill="#3d5a45"/><circle cx="56" cy="22" r="5" fill="#3d5a45"/>
  <circle cx="156" cy="70" r="30" fill="#9fe0a8" mask="url(#crescent)"/>
  <rect x="20" y="132" width="180" height="3" rx="1.5" fill="#9fe0a8" opacity=".5"/>
  <rect x="44" y="144" width="132" height="3" rx="1.5" fill="#9fe0a8" opacity=".3"/>
  <g transform="translate(66 92) scale(.55)">
    <ellipse cx="0" cy="10" rx="30" ry="42" fill="#e9f3ea"/>
    <circle cx="0" cy="-30" r="22" fill="#e9f3ea"/>
    <ellipse cx="0" cy="18" rx="19" ry="28" fill="#9fe0a8"/>
    <circle cx="0" cy="-34" r="5" fill="#0f1412"/><circle cx="14" cy="-34" r="5" fill="#0f1412"/>
    <ellipse cx="10" cy="-23" rx="11" ry="5" fill="#e8c27a"/>
    <ellipse cx="-14" cy="52" rx="13" ry="6" fill="#e8c27a"/><ellipse cx="14" cy="52" rx="13" ry="6" fill="#e8c27a"/>
  </g>
</svg>
